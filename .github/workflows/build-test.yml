name: Build & Test

# Deterministic CI guardrail for the OTPLESS Flutter plugin: formatting,
# analysis, Dart unit tests, the public-Dart-surface golden, and the mechanical
# doc/bridge fact-checks. Runs on every PR into main (no paths filter, so it is
# safe to require as a branch-protection status check) and on every push to main.
#
# The native-bridge example builds live in a separate job because they need a
# full Android SDK / Xcode and are much slower — but they are NOT optional for
# changes under android/ or ios/ (see CLAUDE.md constitution article 6).
#
# This workflow never pushes commits.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The line below restates GATE_CMD in the root Makefile — the canonical
      # gate definition. scripts/docs-verify.sh check 6 fails if they drift.
      - name: Format, analyze, test
        run: dart format --output=none --set-exit-if-changed lib test && flutter analyze --fatal-infos lib test && flutter test

      - name: Public Dart surface golden
        run: python3 scripts/dart_surface.py --check

      - name: Mechanical doc & bridge checks
        run: bash scripts/docs-verify.sh

  # Proves the Kotlin bridge actually compiles against the pinned
  # otpless-headless-sdk. `flutter test` never loads Kotlin, so without this a
  # broken Android bridge merges green.
  example-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

  # Proves the Swift bridge compiles against the pinned OtplessBM/Core.
  # macOS runners are billed at a premium, so this job is scoped to diffs that
  # can actually break it.
  example-ios:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Build example for iOS (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
