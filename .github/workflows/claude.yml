name: Claude

# Responds to @claude mentions in issues, PRs and review comments.
#
# Security notes:
#   * Untrusted text (issue/PR/comment bodies) is NEVER interpolated into a
#     `run:` step here — the action reads event context itself.
#   * The trigger requires the mention to come from a repo collaborator, so a
#     drive-by comment on a public repo cannot spend tokens or push branches.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Only act on an explicit @claude mention from someone with write access.
    if: |
      (
        contains(github.event.comment.body, '@claude') ||
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.review.body, '@claude')
      ) && (
        github.event.sender.type != 'Bot'
      ) && (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          cache: true

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE.md and .claude/skills/ load automatically from the repo root.
          # Judgment tier: open-ended human requests against a public-API-bearing
          # repo (hub CLAUDE.md model routing). Pinned here, per hub policy.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(make gate),Bash(make test),Bash(make analyze),Bash(make docs-verify),Bash(make surface-check),Bash(flutter *),Bash(dart *),Bash(python3 scripts/dart_surface.py*),Bash(bash scripts/docs-verify.sh),Bash(git diff*),Bash(git log*),Bash(git show*),Edit,Write,Read,Grep,Glob"
