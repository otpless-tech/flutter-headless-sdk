name: Atlas docs

# Platform documentation for this plugin lives in otpless-tech/atlas, not in a
# docs/ directory here. Two reusable workflows there keep that honest:
#
#   verify-docs  — on every PR: fails this PR if an Atlas page this repo owns has
#                  fallen behind this PR's source. This is the direct replacement
#                  for an in-repo doc fact-check; it has to run in Atlas because
#                  this repo has no Atlas checkout, and it reports back here as a
#                  status check.
#   sync-from-source — on merge: regenerates only the Atlas pages whose manifest
#                  `source` matches the files that changed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    if: github.event_name == 'pull_request'
    uses: otpless-tech/atlas/.github/workflows/verify-docs.yml@main
    with:
      source_repo: flutter-headless-sdk
      source_sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      # Atlas is private; the caller's github.token cannot read it.
      ATLAS_PAT: ${{ secrets.ATLAS_PAT }}

  sync:
    if: github.event_name == 'push'
    uses: otpless-tech/atlas/.github/workflows/sync-from-source.yml@main
    with:
      source_repo: flutter-headless-sdk
      source_ref: ${{ github.sha }}
    secrets:
      ATLAS_PAT: ${{ secrets.ATLAS_PAT }}
