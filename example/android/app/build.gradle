plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    compileSdkVersion 36//flutter.compileSdkVersion
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.digvijayanubhav.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34


        //region === web authin ===
        resValue 'string', 'host', 'https://otpless.com'
        resValue 'string', 'asset_statements', """
           [{
             "include": "https://otpless.com/.well-known/assetlinks.json"
           }]
        """
        //endregion
    }

    // Release signing is OPTIONAL. `signingConfigs` is evaluated at configuration
    // time, so an unconditional `file(localProperties.getProperty("storeFile"))`
    // threw "path may not be null or empty string" for EVERY gradle task —
    // including assembleDebug — on any machine without a keystore in
    // local.properties. That made the example app unbuildable, which in turn made
    // the Kotlin bridge unverifiable (see the verify skill, rung 2).
    def hasReleaseKeystore = localProperties.getProperty("storeFile") != null

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(localProperties.getProperty("storeFile"))
                storePassword localProperties.getProperty("storePassword")
                keyAlias localProperties.getProperty("keyAlias")
                keyPassword localProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            // Fall back to the debug keys when no keystore is configured, so
            // `flutter build apk --release` works on CI for size measurement.
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    namespace 'com.example.otpless_flutter_example'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10"
    implementation 'io.github.otpless-tech:otpless-truecaller-sdk-impl:1.0.2'
}
